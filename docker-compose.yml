version: '3'
services:
    web:
        image: litespeedtech/openlitespeed:latest
        working_dir: /var/www/vhosts/localhost/html
        container_name: bsc-web
        restart: unless-stopped
        environment:
            TZ: Europe/Budapest
        ports:
            - "${BIND_IP:-127.0.0.1}:${PORT:-8080}:80"
        volumes:
            - ./html/:/var/www/vhosts/localhost/html